    html+=`<section class="sec"><h2>${esc(s.name||l.all)}</h2><div class="list">`+items.map(it=>{
      const chips=it.c.map(i=>`<span class="c">${l.names[i]}</span>`).join('')+it.m.map(i=>`<span class="c m">${l.m} · ${l.names[i]}</span>`).join('');
      return `<div class="row"><b>${esc(it.n)}</b><div class="chips">${chips||`<span class="none">${l.none}</span>`}</div></div>`}).join('')+`</div></section>`;
  }
  $('out').innerHTML=html||`<div class="empty">${l.empty}</div>`;
  $('cnt').textContent=l.cnt(n,tot);
}
$('t0').onclick=()=>{tab=0;render()}; $('t1').onclick=()=>{tab=1;render()};
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('fl').onclick=e=>{const b=e.target.closest('.chip-f');if(!b)return;const i=+b.dataset.i;avoid.has(i)?avoid.delete(i):avoid.add(i);render()};
render();
</script>
</body>
</html>
